name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Build portable packages
        run: .\tools\build.ps1
      - name: Verify and smoke-test both packages
        shell: pwsh
        run: |
          foreach ($line in Get-Content .\artifacts\SHA256SUMS.txt) {
              $hash, $name = $line -split '  ', 2
              $archive = Join-Path artifacts $name
              if ((Get-FileHash -LiteralPath $archive).Hash -ne $hash) {
                  throw "Invalid SHA-256 for $name"
              }
              $extracted = Join-Path $env:RUNNER_TEMP ([IO.Path]::GetFileNameWithoutExtension($name))
              Expand-Archive -LiteralPath $archive -DestinationPath $extracted
              .\tools\smoke.ps1 -App (Join-Path $extracted 'eFootballNet.exe') -OutputDirectory (Join-Path $extracted 'smoke')
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eFootballNet-win-x64
          path: artifacts/
          if-no-files-found: error
